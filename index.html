<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A Trello-style Kanban board built with React, Redux Toolkit and dnd-kit." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%234f46e5'/%3E%3Crect x='20' y='22' width='16' height='56' rx='5' fill='white'/%3E%3Crect x='42' y='22' width='16' height='38' rx='5' fill='white'/%3E%3Crect x='64' y='22' width='16' height='26' rx='5' fill='white'/%3E%3C/svg%3E" />
    <title>Kanban Board</title>
    <script>
      // Apply the saved theme BEFORE React loads, so there is no white flash in dark mode.
      (function () {
        try {
          var saved = localStorage.getItem('kanban-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
